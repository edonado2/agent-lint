name: agent-lint
description: Check AI agent instruction files for stale paths, renamed scripts and broken links
inputs:
  path:
    description: Directory to scan
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - name: Run agent-lint
      shell: bash
      run: node ${{ github.action_path }}/bin/agent-lint.js ${{ inputs.path }} --json
